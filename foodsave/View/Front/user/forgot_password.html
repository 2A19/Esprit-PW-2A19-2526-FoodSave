            <?php if ($step === 'email'): ?>
                <form method="POST" action="index.php?action=handleForgotPasswordSendCode">
                    <div class="form-group">
                        <label for="email">Email du compte</label>
                        <input type="email" id="email" name="email" required placeholder="votre@email.com">
                    </div>

                </form>
            <?php elseif ($step === 'code'): ?>
                <form method="POST" action="index.php?action=handleForgotPasswordVerifyCode">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="<?php echo htmlspecialchars($email); ?>" disabled>
                    </div>
                    <div class="form-group">
                        <label for="code">Code à 6 chiffres</label>
                        <input
                            type="text"
                            id="code"
                            name="code"
                            required
                            maxlength="6"
                            inputmode="numeric"
                            pattern="[0-9]{6}"
                            placeholder="123456"
                        >
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Vérifier le code</button>
                </form>
                <form method="POST" action="index.php?action=handleForgotPasswordSendCode" style="margin-top: 10px;">
                    <input type="hidden" name="email" value="<?php echo htmlspecialchars($email); ?>">
                    <button type="submit" class="btn btn-outline btn-block">Renvoyer un code</button>
                </form>
            <?php else: ?>
                <form method="POST" action="index.php?action=handleForgotPasswordReset">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="<?php echo htmlspecialchars($email); ?>" disabled>
                    </div>
                    <div class="form-group">

                    <div class="form-group">

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Modifier le mot de passe</button>
